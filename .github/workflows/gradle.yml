# GitHub Actions 워크플로우 이름 설정
name: Spring Boot CI/CD with Docker

# 워크플로우가 실행될 조건 설정
# dev 브랜치에 push 또는 pull_request가 발생하면 실행
on:
 push:
   branches: [ "dev" ]
 pull_request:
   branches: [ "dev" ]

# 워크플로우에서 사용할 권한 설정
permissions:
 contents: read  # 레포지토리 내용을 읽을 수 있는 권한

# 실행할 작업들을 정의
jobs:
 # 빌드 및 배포 작업 (Job 이름)
 build-and-deploy:
   # GitHub Actions에서 제공하는 Ubuntu 최신 버전 러너 사용
   runs-on: ubuntu-latest
   
   # 이 Job에서 실행할 단계별 작업들
   steps:
   # Step 1: 소스코드를 GitHub에서 체크아웃 (다운로드)
   - name: Checkout repository
     uses: actions/checkout@v4
   
   # Step 2: GitHub Secrets에 저장된 application.properties 파일 생성
   # 민감한 정보(DB 비밀번호, API 키 등)가 포함된 설정 파일을 안전하게 생성
   - name: Create application.properties from secrets
     run: |
       echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.properties
       echo "✅ application.properties 파일이 생성되었습니다."
   
   # Step 3: Java 17 개발 환경 설정
   # Spring Boot 애플리케이션 빌드를 위해 필요
   - name: Set up JDK 17
     uses: actions/setup-java@v4
     with:
       java-version: '17'          # Java 버전 지정
       distribution: 'temurin'     # OpenJDK 배포판 선택
   
   # ✅ 추가: Gradle 캐시 설정 (의존성 다운로드 시간 대폭 단축!)
   - name: Cache Gradle packages
     uses: actions/cache@v3
     with:
       path: |
         ~/.gradle/caches
         ~/.gradle/wrapper
       key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
       restore-keys: |
         ${{ runner.os }}-gradle-
   
   # Step 4: gradlew 파일에 실행 권한 부여
   # Linux 환경에서 Gradle Wrapper 실행을 위해 필요
   - name: Grant execute permission for gradlew
     run: |
       chmod +x gradlew
       echo "✅ gradlew 실행 권한이 부여되었습니다."
   
   # Step 5: Spring Boot 애플리케이션 빌드
   # JAR 파일 생성
   - name: Build Spring Boot application
     run: |
       echo "🔨 Spring Boot 애플리케이션 빌드를 시작합니다..."
       ./gradlew clean build -x test
       echo "✅ 빌드가 성공적으로 완료되었습니다."
   
   # ✅ 추가: Docker Buildx 설정 (캐시 활용)
   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v3
   
   # Step 6: Docker Hub에 로그인
   # Docker 이미지를 푸시하기 위해 Docker Hub 인증 필요
   - name: Login to Docker Hub
     uses: docker/login-action@v3
     with:
       username: ${{ secrets.DOCKERHUB_USERNAME }}
       password: ${{ secrets.DOCKERHUB_PASSWORD }}
   
   # Step 7: Docker 이미지 빌드 및 푸시 (캐시 활용으로 속도 향상)
   - name: Build and push Docker image
     uses: docker/build-push-action@v5
     with:
       context: .
       push: true
       tags: ${{ secrets.DOCKERHUB_USERNAME }}/morak-backend:latest
       cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/morak-backend:buildcache
       cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/morak-backend:buildcache,mode=max
   
   # Step 8: 빌드 결과 요약 출력
   - name: Build summary
     run: |
       echo "🎉 CI/CD 파이프라인이 성공적으로 완료되었습니다!"
       echo "📦 빌드된 이미지: ${{ secrets.DOCKERHUB_USERNAME }}/morak-backend:latest"
       echo "🐳 Docker Hub에서 이미지를 확인할 수 있습니다."

 # 의존성 제출 작업 (별도 Job)
 # GitHub의 Dependabot 알림을 위한 의존성 그래프 생성
 dependency-submission:
   # build-and-deploy Job과 독립적으로 실행
   runs-on: ubuntu-latest
   permissions:
     contents: write  # 의존성 그래프를 제출하기 위한 쓰기 권한
   
   steps:
   # 소스코드 체크아웃
   - name: Checkout repository
     uses: actions/checkout@v4
   
   # Java 환경 설정
   - name: Set up JDK 17
     uses: actions/setup-java@v4
     with:
       java-version: '17'
       distribution: 'temurin'
   
   # 의존성 그래프 생성 및 GitHub에 제출
   # 보안 취약점 알림 및 자동 업데이트를 위해 사용
   - name: Generate and submit dependency graph
     uses: gradle/actions/dependency-submission@v4
