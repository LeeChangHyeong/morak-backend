<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-container {
            width: 90%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .chat-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .connection-section {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .token-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        
        .token-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-connect {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-connect:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-disconnect {
            background: #e74c3c;
            color: white;
        }
        
        .btn-disconnect:hover:not(:disabled) {
            background: #c0392b;
        }
        
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status {
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: 500;
            text-align: center;
        }
        
        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .chat-section {
            height: 400px;
            display: flex;
            flex-direction: column;
        }
        
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .message.system {
            background: #e3f2fd;
            color: #1976d2;
            margin: 0 auto;
            text-align: center;
            max-width: 90%;
            font-style: italic;
        }
        
        .message.server {
            background: #e8f5e8;
            color: #2e7d32;
            margin-left: 0;
        }
        
        .message.sent {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
        }
        
        .message-time {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        
        .message-content {
            font-size: 0.9rem;
        }
        
        .input-section {
            padding: 20px;
            background: white;
            border-top: 1px solid #eee;
        }
        
        .message-input-group {
            display: flex;
            gap: 10px;
        }
        
        .message-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .message-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-send:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-send:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* 스크롤바 스타일링 */
        .messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .messages::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }
        
        .messages::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .chat-container {
                width: 95%;
                margin: 10px;
            }
            
            .chat-section {
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>💬 실시간 채팅</h1>
        </div>
        
        <div class="connection-section">
            <input type="text" id="tokenInput" class="token-input" placeholder="JWT 토큰을 입력하세요...">
            <div class="btn-group">
                <button id="connectBtn" class="btn btn-connect" onclick="connect()">연결</button>
                <button id="disconnectBtn" class="btn btn-disconnect" onclick="disconnect()" disabled>연결 끊기</button>
            </div>
            <div id="status" class="status disconnected">🔴 연결되지 않음</div>
        </div>

        <div class="chat-section">
            <div id="messages" class="messages"></div>
            <div class="input-section">
                <div class="message-input-group">
                    <input type="text" id="messageInput" class="message-input" placeholder="메시지를 입력하세요..." disabled>
                    <button id="sendBtn" class="btn-send" onclick="sendMessage()" disabled>전송</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let websocket = null;
        
        function connect() {
            const token = document.getElementById('tokenInput').value.trim();
            
            if (!token) {
                alert('토큰을 입력해주세요!');
                return;
            }
            
            try {
                const wsUrl = `ws://localhost:8080/chat?token=${token}`;
                websocket = new WebSocket(wsUrl);
                
                websocket.onopen = function(event) {
                    updateStatus(true, '🟢 연결됨');
                    addMessage('system', 'WebSocket 연결이 성공했습니다! 🎉');
                };
                
                websocket.onmessage = function(event) {
                    addMessage('server', event.data);
                };
                
                websocket.onclose = function(event) {
                    updateStatus(false, '🔴 연결 끊김');
                    addMessage('system', 'WebSocket 연결이 종료되었습니다. 😔');
                };
                
                websocket.onerror = function(error) {
                    updateStatus(false, '❌ 연결 오류');
                    addMessage('system', '연결 오류가 발생했습니다. 토큰을 확인해주세요.');
                    console.error('WebSocket error:', error);
                };
                
            } catch (error) {
                alert('연결 실패: ' + error.message);
            }
        }
        
        function disconnect() {
            if (websocket) {
                websocket.close();
                websocket = null;
            }
        }
        
        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (message && websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(message);
                addMessage('sent', message);
                messageInput.value = '';
            }
        }
        
        function addMessage(type, message) {
            const messagesDiv = document.getElementById('messages');
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type}`;
            
            const timestamp = new Date().toLocaleTimeString('ko-KR');
            
            messageElement.innerHTML = `
                <div class="message-time">${timestamp}</div>
                <div class="message-content">${message}</div>
            `;
            
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function updateStatus(connected, statusText) {
            const statusDiv = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            
            if (connected) {
                statusDiv.className = 'status connected';
                statusDiv.textContent = statusText;
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
            } else {
                statusDiv.className = 'status disconnected';
                statusDiv.textContent = statusText;
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                messageInput.disabled = true;
                sendBtn.disabled = true;
            }
        }
        
        // Enter 키로 메시지 전송
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Enter 키로 연결
        document.getElementById('tokenInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                connect();
            }
        });
        
        // 페이지 로드 시 환영 메시지
        window.addEventListener('load', function() {
            addMessage('system', '환영합니다! JWT 토큰을 입력하고 채팅을 시작해보세요. 🚀');
        });
    </script>
</body>
</html>
